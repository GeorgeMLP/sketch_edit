[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sketch-edit"
version = "0.1.0"
description = "Modular pipeline for sketch+text-guided image editing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "George Ma", email = "george_ma@berkeley.edu"},
    {name = "Anya Ji", email = "anyaji@berkeley.edu"},
    {name = "Téa Wright", email = "teaywright@berkeley.edu"},
    {name = "Yiming Zhang", email = "ym_zhang@berkeley.edu"}
]
keywords = ["image-editing", "diffusion", "controlnet", "sketch", "multimodal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.4.0,<2.7.0",
    "torchvision>=0.19.0",
    "diffusers>=0.30.0",
    "transformers>=4.45.0",
    "accelerate>=0.34.0",
    "Pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "einops>=0.8.0",
    "jaxtyping>=0.2.34",
    "datasets>=3.0.0",
    "tqdm>=4.66.0",
    "numpy>=1.24.0",
    "pytz>=2024.1",
]

[project.optional-dependencies]
eval = [
    "pytorch-fid>=0.3.0",
    "lpips>=0.1.4",
    "pandas>=2.0.0",
]
dev = [
    "matplotlib>=3.8.0",
    "ipykernel>=6.0.0",
    "pytest>=8.0.0",
]
all = [
    "sketch-edit[eval,dev]",
    "controlnet-aux>=0.0.9",
    "xformers>=0.0.28; sys_platform != 'darwin'",
]

[project.scripts]
sketch-edit-train = "sketch_edit.scripts.train:main"
sketch-edit-eval = "sketch_edit.scripts.evaluate:main"
sketch-edit-infer = "sketch_edit.scripts.inference:main"
sketch-edit-datagen = "sketch_edit.scripts.generate_dataset:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sketch_edit*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
